<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062c25">
  <title>Royal Flush — Table de poker</title>
  <style>
    :root {
      color-scheme: dark;
      --felt: #087a37;
      --felt-dark: #07532d;
      --gold: #e5c46b;
      --muted: #c4d2c9;
      --panel: #06120f;
      --red: #df2635;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #fff;
      font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: #052d27;
      background-image:
        radial-gradient(circle at 15% 20%, transparent 0 42px, #ffffff0b 43px 46px, transparent 47px),
        radial-gradient(circle at 82% 72%, transparent 0 58px, #ffffff0a 59px 62px, transparent 63px),
        repeating-linear-gradient(45deg, #ffffff06 0 2px, transparent 2px 25px);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .42; }

    .app { position: relative; width: 100vw; height: 100vh; height: 100dvh; min-height: 560px; overflow: hidden; }
    .topbar {
      position: absolute; z-index: 10; inset: 0 0 auto; height: 62px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid #ffffff19; background: #031b17e8;
    }
    .brand { font-weight: 900; letter-spacing: .08em; }
    .brand b, .balance { color: var(--gold); }
    .balance { font-size: 13px; font-weight: 800; }

    .join-panel {
      position: absolute; z-index: 20; top: 50%; left: 50%; width: min(92vw, 390px);
      padding: 24px; transform: translate(-50%, -50%); border: 1px solid #ffffff25;
      border-radius: 20px; background: #081b18; box-shadow: 0 18px 55px #0009;
    }
    .join-panel[hidden] { display: none; }
    .join-panel h1 { margin: 0 0 8px; font-size: 26px; }
    .join-panel p { color: var(--muted); }
    .join-form { display: flex; gap: 8px; }
    .join-form input {
      min-width: 0; flex: 1; padding: 12px; border: 1px solid #ffffff30;
      border-radius: 10px; background: #071510; color: #fff;
    }
    .join-form button {
      padding: 11px 16px; border: 0; border-radius: 10px;
      background: linear-gradient(#f2d889, #c9a94f); color: #182018; font-weight: 850;
    }
    .message { min-height: 20px; margin-top: 9px; color: #ffd3a3; font-size: 13px; }

    .game { position: absolute; inset: 62px 0 0; display: none; }
    .game.visible { display: block; }
    .table-head {
      position: absolute; z-index: 8; top: 9px; left: 12px; right: 12px;
      display: flex; align-items: center; justify-content: space-between; pointer-events: none;
    }
    .table-head button {
      pointer-events: auto; padding: 8px 12px; border: 1px solid #ffffff36;
      border-radius: 10px; background: #07110edb; color: #fff;
    }
    .seat-count { color: var(--muted); font-size: 12px; }

    .table {
      position: absolute; top: 48%; left: 50%; width: min(96vw, 590px);
      height: min(76dvh, 900px); min-height: 430px; transform: translate(-50%, -50%);
      overflow: hidden; border: 12px solid #101c18; border-radius: 49% / 25%;
      background: radial-gradient(ellipse at 50% 43%, #13a34d 0%, #087e38 52%, #07542d 100%);
      box-shadow: 0 0 0 5px #254936, 0 0 0 10px #0b1512, 0 22px 45px #0008, inset 0 0 45px #001c0b80;
    }
    .table::before {
      position: absolute; inset: 14px; border: 2px solid #d5efcb22;
      border-radius: inherit; content: ""; pointer-events: none;
    }
    .table::after {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #d8f4dc16; font-size: clamp(100px, 25vw, 170px); line-height: 1;
      content: "♠"; pointer-events: none;
    }
    .table-title {
      position: absolute; z-index: 2; top: 16px; left: 50%; transform: translateX(-50%);
      color: #ffffff9c; font-size: 10px; letter-spacing: .2em; white-space: nowrap;
    }

    .seats { position: absolute; z-index: 4; inset: 0; }
    .seat {
      position: absolute; width: clamp(74px, 20vw, 108px); min-height: 112px;
      transform: translate(-50%, -50%); text-align: center;
    }
    /* Le siège du joueur local est toujours en bas. */
    .seat.s0 { left: 50%; top: 87%; }
    .seat.s1 { left: 14%; top: 67%; }
    .seat.s2 { left: 14%; top: 31%; }
    .seat.s3 { left: 50%; top: 12%; }
    .seat.s4 { left: 86%; top: 31%; }
    .seat.s5 { left: 86%; top: 67%; }

    .seat-cards { display: flex; height: 33px; justify-content: center; gap: 3px; margin-bottom: 2px; }
    .playing {
      display: grid; width: 23px; height: 31px; place-items: center;
      border: 1px solid #ddd7ce; border-radius: 5px; background: #fff9e8;
      color: #101812; font-size: 11px; font-weight: 900; box-shadow: 0 2px 7px #0006;
    }
    .playing.red { color: #d22b37; }
    .playing.back {
      border-color: #ffffff80;
      background: repeating-linear-gradient(45deg, #274d82 0 4px, #132b53 4px 8px);
      color: #eaf1ff;
    }
    .avatar {
      position: relative; z-index: 2; display: grid; width: 42px; height: 42px;
      margin: 0 auto -2px; place-items: center; border: 3px solid #ffffffc9;
      border-radius: 50%; background: linear-gradient(145deg, #dbc7a6, #887763);
      color: #152019; font-weight: 900; box-shadow: 0 4px 12px #0007;
    }
    .stars { height: 15px; color: #fff; font-size: 12px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
    .seat.active .avatar { outline: 2px solid var(--gold); box-shadow: 0 0 15px #f6d569a3; }
    .player-box { overflow: hidden; border: 1px solid #ffffff20; border-radius: 5px; background: #001d13e8; box-shadow: 0 4px 11px #0005; }
    .player-name {
      overflow: hidden; padding: 3px 2px; background: #0b4229; font-size: 11px;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .player-stack { min-height: 23px; padding: 3px 2px; font-size: 11px; font-weight: 750; }
    .player-bet {
      position: absolute; top: -19px; left: 50%; padding: 3px 8px;
      transform: translateX(-50%); border-radius: 15px; background: #020604eb;
      color: #fff; font-size: 10px; white-space: nowrap;
    }
    .seat.folded { opacity: .45; filter: grayscale(1); }

    .center {
      position: absolute; z-index: 3; top: 49%; left: 50%; display: flex;
      width: 100%; transform: translate(-50%, -50%); flex-direction: column;
      align-items: center; pointer-events: none;
    }
    .community { display: flex; min-height: 68px; justify-content: center; gap: 5px; margin-bottom: 12px; }
    .community .playing, .community .empty {
      display: grid; width: clamp(39px, 10vw, 53px); height: clamp(57px, 15vw, 75px);
      place-items: center; border: 2px solid #fff; border-radius: 7px;
      background: linear-gradient(145deg, #fff, #eeeae2); color: #121212;
      font-size: clamp(17px, 4.5vw, 24px); font-weight: 900; box-shadow: 0 4px 10px #0005;
    }
    .community .playing.red { color: #d21c31; }
    .community .empty { border: 1px dashed #ffffff70; background: #ffffff0b; box-shadow: none; }
    .pot {
      display: flex; align-items: center; gap: 9px; padding: 8px 19px;
      border: 1px solid #e4c66e77; border-radius: 40px; background: #001d13ef;
      font-size: 12px; letter-spacing: .13em; box-shadow: 0 4px 12px #0005;
    }
    .pot strong { color: #ffd633; font-size: 23px; letter-spacing: 0; }
    .phase {
      position: absolute; z-index: 5; top: 67%; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 30px; background: #d92737;
      font-size: 13px; font-weight: 900; letter-spacing: .08em; white-space: nowrap;
    }

    .controls {
      position: absolute; z-index: 8; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      left: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      padding: 11px; border: 1px solid #ffffff20; border-radius: 18px;
      background: #030907ed; box-shadow: 0 8px 24px #0008;
    }
    .notice { grid-column: 1 / -1; min-height: 18px; color: #e8d9ad; font-size: 12px; }
    .raise-line {
      display: grid; grid-column: 1 / -1; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 10px; font-size: 12px;
    }
    .raise-line input { width: 100%; accent-color: var(--gold); }
    .raise-amount { min-width: 48px; color: var(--gold); font-weight: 800; text-align: right; }
    .action {
      min-height: 46px; padding: 7px 4px; border: 0; border-radius: 11px;
      color: #fff; font-size: clamp(10px, 3vw, 14px); font-weight: 850;
    }
    .fold { background: linear-gradient(#e33a3a, #a31620); }
    .call { background: linear-gradient(#1683d9, #1453a6); }
    .raise { background: linear-gradient(#f0d88e, #c9a64e); color: #182018; }
    .all-in { background: linear-gradient(#ff9800, #df4b00); }

    @media (max-width: 390px) {
      .table { width: 98vw; height: 72dvh; min-height: 410px; border-width: 9px; }
      .seat { width: 70px; }
      .seat.s1, .seat.s5 { top: 68%; }
      .seat.s2, .seat.s4 { top: 31%; }
      .player-name, .player-stack { font-size: 10px; }
      .controls { right: 7px; left: 7px; gap: 5px; padding: 8px; }
      .action { min-height: 42px; }
    }
    @media (max-height: 700px) {
      .table { height: 66dvh; min-height: 360px; }
      .controls { gap: 5px; padding: 7px; }
      .action { min-height: 38px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">♠ <b>ROYAL</b> FLUSH</div>
      <div class="balance" id="balance">— jetons</div>
    </header>

    <section class="join-panel" id="join-panel">
      <h1>Rejoindre la table</h1>
      <p>Choisis un pseudo pour rejoindre les autres joueurs connectés.</p>
      <form class="join-form" id="join-form">
        <input id="player-name" maxlength="18" placeholder="Ton pseudo" autocomplete="nickname" required>
        <button id="join-button" type="submit">Jouer</button>
      </form>
      <div class="message" id="message" role="status">Jetons fictifs · table multijoueur</div>
    </section>

    <section class="game" id="game" aria-label="Table de poker">
      <div class="table-head">
        <button id="leave-button" type="button">‹ Quitter</button>
        <strong>Texas Hold’em</strong>
        <span class="seat-count" id="seat-count">0/6</span>
      </div>

      <section class="table">
        <div class="table-title">TABLE DE POKER · JETONS FICTIFS</div>
        <div class="seats" id="seats"></div>
        <div class="center">
          <div class="community" id="board"></div>
          <div class="pot">POT <strong id="pot">0</strong><span>jet.</span></div>
        </div>
        <div class="phase" id="phase">EN ATTENTE</div>
      </section>

      <section class="controls">
        <div class="notice" id="notice">Connexion à la table…</div>
        <div class="raise-line">
          <label for="slider">Mise</label>
          <input id="slider" type="range" min="50" max="2000" step="25" value="100">
          <output class="raise-amount" id="amount">100</output>
        </div>
        <button class="action fold" id="fold" type="button" disabled>Se coucher</button>
        <button class="action call" id="call" type="button" disabled>Suivre</button>
        <button class="action raise" id="raise" type="button" disabled>Relancer</button>
        <button class="action all-in" id="all-in" type="button" disabled>All-in</button>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let socket = null;
      let state = null;
      let playerName = '';

      // Le serveur actuel accepte six joueurs.
      const seatPositions = [
        [50, 87], // joueur local, en bas
        [14, 67],
        [14, 31],
        [50, 12],
        [86, 31],
        [86, 67]
      ];

      const money = value => Math.floor(Number(value) || 0).toLocaleString('fr-FR');
      const escapeHtml = text => String(text).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);

      function send(data) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(data));
        }
      }

      function cardHtml(card, hidden = false) {
        if (!card || hidden) {
          return '<span class="playing back" aria-label="Carte cachée">♠</span>';
        }
        const red = card.suit === '♥' || card.suit === '♦';
        return `<span class="playing ${red ? 'red' : ''}">${escapeHtml(card.rank)}${escapeHtml(card.suit)}</span>`;
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}`);
        $('join-button').disabled = true;
        $('message').textContent = 'Connexion à la table…';

        socket.addEventListener('open', () => send({ type: 'join', name: playerName }));

        socket.addEventListener('message', event => {
          let message;
          try { message = JSON.parse(event.data); } catch { return; }

          if (message.type === 'error') {
            $('message').textContent = message.message;
            $('notice').textContent = message.message;
            return;
          }
          if (message.type !== 'state') return;

          state = message;
          $('join-panel').hidden = true;
          $('game').classList.add('visible');
          render();
        });

        socket.addEventListener('close', () => {
          $('join-panel').hidden = false;
          $('join-button').disabled = false;
          $('message').textContent = 'Connexion interrompue. Recharge la page pour rejoindre.';
        });

        socket.addEventListener('error', () => {
          $('message').textContent = 'Impossible de joindre le serveur de jeu.';
        });
      }

      function render() {
        if (!state) return;

        const me = state.players.find(player => player.id === state.selfId);
        const ordered = [...state.players];
        const selfIndex = ordered.findIndex(player => player.id === state.selfId);
        if (selfIndex >= 0) ordered.push(...ordered.splice(0, selfIndex));

        $('balance').textContent = `${money(me?.chips)} jetons`;
        $('seat-count').textContent = `${ordered.length}/6`;
        $('pot').textContent = money(state.pot);
        $('notice').textContent = state.notice || 'En attente.';

        const phaseNames = {
          lobby: 'EN ATTENTE', preflop: 'PRÉFLOP', flop: 'FLOP',
          turn: 'TURN', river: 'RIVER', finished: 'MAIN TERMINÉE'
        };
        $('phase').textContent = phaseNames[state.phase] || String(state.phase).toUpperCase();

        $('board').innerHTML = Array.from({ length: 5 }, (_, index) =>
          state.board?.[index] ? cardHtml(state.board[index]) : '<span class="empty"></span>'
        ).join('');

        $('seats').innerHTML = ordered.map((player, index) => {
          const [x, y] = seatPositions[index] || [50, 50];
          const isTurn = player.id === state.turnId && state.phase !== 'finished';
          const cards = player.cards
            ? player.cards.map(card => cardHtml(card)).join('')
            : cardHtml(null, true) + cardHtml(null, true);
          const bet = player.streetBet
            ? `<div class="player-bet">Mise ${money(player.streetBet)}</div>`
            : player.id === state.dealerId ? '<div class="player-bet">Dealer</div>' : '';

          return `
            <article class="seat s${index} ${isTurn ? 'active' : ''} ${player.folded ? 'folded' : ''}"
              style="left:${x}%;top:${y}%">
              ${bet}
              <div class="seat-cards">${cards}</div>
              <div class="avatar">${escapeHtml((player.name || '?').slice(0, 1).toUpperCase())}</div>
              <div class="stars" aria-hidden="true">★★★★★</div>
              <div class="player-box">
                <div class="player-name">${escapeHtml(player.name)}${player.id === state.selfId ? ' · VOUS' : ''}</div>
                <div class="player-stack">${money(player.chips)} jet.</div>
              </div>
            </article>`;
        }).join('');

        const myTurn = state.turnId === state.selfId;
        const owing = me ? Math.max(0, state.currentBet - me.streetBet) : 0;
        $('fold').disabled = !myTurn;
        $('call').disabled = !myTurn || owing <= 0 || owing > (me?.chips || 0);
        $('call').textContent = owing ? `Suivre ${money(owing)}` : 'Suivre';
        $('raise').disabled = !myTurn || !me || me.chips <= owing;
        $('all-in').disabled = !myTurn || !me;

        const canStart = state.players.length >= 2 &&
          (state.phase === 'lobby' || state.phase === 'finished');
        $('start-button').disabled = !canStart;
        $('start-button').textContent = state.phase === 'finished' ? 'Nouvelle main' : 'Démarrer';

        const minimum = Math.max(50, state.currentBet + state.minRaise);
        $('slider').min = minimum;
        $('slider').max = me ? Math.max(minimum, me.streetBet + me.chips) : 2000;
        if (Number($('slider').value) < minimum) $('slider').value = minimum;
        $('amount').value = money($('slider').value);
        $('amount').textContent = money($('slider').value);
      }

      $('join-form').addEventListener('submit', event => {
        event.preventDefault();
        playerName = $('player-name').value.trim();
        if (playerName) connect();
      });

      $('start-button').addEventListener('click', () => send({ type: 'start' }));
      $('fold').addEventListener('click', () => send({ type: 'action', action: 'fold' }));
      $('call').addEventListener('click', () => send({ type: 'action', action: 'call' }));
      $('raise').addEventListener('click', () => send({ type: 'action', action: 'raise', amount: $('slider').value }));
      $('all-in').addEventListener('click', () => {
        const me = state?.players.find(player => player.id === state.selfId);
        if (me) send({ type: 'action', action: 'raise', amount: me.streetBet + me.chips });
      });
      $('slider').addEventListener('input', () => {
        $('amount').value = money($('slider').value);
        $('amount').textContent = money($('slider').value);
      });
      $('leave-button').addEventListener('click', () => {
        socket?.close();
        location.reload();
      });
    })();
  </script>
</body>
</html>
